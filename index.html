<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merger - Merge Your PDFs with Style</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        /* Fallback font awesome icons */
        .fas {
            font-family: 'Font Awesome 6 Free', sans-serif;
            font-weight: 900;
        }
        .fa-file-pdf:before { content: "📄"; }
        .fa-cloud-upload-alt:before { content: "☁️"; }
        .fa-list:before { content: "📋"; }
        .fa-trash:before { content: "🗑️"; }
        .fa-compress-arrows-alt:before { content: "🔄"; }
        .fa-cog:before { content: "⚙️"; }
        .fa-check-circle:before { content: "✅"; }
        .fa-download:before { content: "⬇️"; }
        .fa-redo:before { content: "🔄"; }
        .fa-chevron-up:before { content: "⬆️"; }
        .fa-chevron-down:before { content: "⬇️"; }
        .fa-exclamation-circle:before { content: "❗"; }
        .fa-info-circle:before { content: "ℹ️"; }
        .fa-spin {
            animation: fa-spin 2s infinite linear;
        }
        @keyframes fa-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-file-pdf"></i>
                    <h1>PDF Merger</h1>
                </div>
                <p class="subtitle">Merge multiple PDF files into one with ease</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Upload Section -->
            <section class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <h3>Drop your PDF files here</h3>
                    <p>or <span class="browse-text">browse files</span></p>
                    <input type="file" id="fileInput" multiple accept=".pdf" hidden>
                    <div class="supported-formats">
                        <small>Supports PDF files only</small>
                    </div>
                </div>
            </section>

            <!-- File List Section -->
            <section class="file-list-section" id="fileListSection" style="display: none;">
                <div class="section-header">
                    <h3>
                        <i class="fas fa-list"></i>
                        Selected Files
                    </h3>
                    <button class="clear-all-btn" id="clearAllBtn">
                        <i class="fas fa-trash"></i>
                        Clear All
                    </button>
                </div>
                <div class="file-list" id="fileList"></div>
                <div class="merge-section">
                    <button class="merge-btn" id="mergeBtn">
                        <i class="fas fa-compress-arrows-alt"></i>
                        Merge PDFs
                    </button>
                </div>
            </section>

            <!-- Progress Section -->
            <section class="progress-section" id="progressSection" style="display: none;">
                <div class="progress-container">
                    <div class="progress-icon">
                        <i class="fas fa-cog fa-spin"></i>
                    </div>
                    <h3>Merging your PDFs...</h3>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="progress-text" id="progressText">0%</p>
                </div>
            </section>

            <!-- Success Section -->
            <section class="success-section" id="successSection" style="display: none;">
                <div class="success-content">
                    <div class="success-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h3>Successfully Merged!</h3>
                    <p>Your PDFs have been merged into a single file.</p>
                    <button class="download-btn" id="downloadBtn">
                        <i class="fas fa-download"></i>
                        Download Merged PDF
                    </button>
                    <button class="restart-btn" id="restartBtn">
                        <i class="fas fa-redo"></i>
                        Merge More Files
                    </button>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2024 PDF Merger. Built with ❤️ for easy PDF management.</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
